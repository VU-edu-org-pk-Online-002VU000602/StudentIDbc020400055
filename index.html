<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Document Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#eef3f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{

width:700px;
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 20px 40px rgba(0,0,0,.12);

}

.header{

background:#003366;
color:#fff;
padding:35px;
text-align:center;

}

.header h1{

font-size:48px;
letter-spacing:8px;

}

.header p{

margin-top:8px;
font-size:18px;
opacity:.9;

}

.content{

padding:35px;

}

table{

width:100%;
border-collapse:collapse;

}

td{

padding:15px;
border-bottom:1px solid #e6e6e6;
font-size:16px;

}

td:first-child{

font-weight:bold;
width:35%;
color:#444;

}

.status{

display:inline-block;
padding:6px 14px;
background:#d4edda;
color:#155724;
border-radius:20px;
font-size:14px;
font-weight:bold;

}

.button{

display:block;
width:100%;
margin-top:35px;
text-align:center;
text-decoration:none;
background:#0056b3;
color:white;
padding:16px;
font-size:18px;
font-weight:bold;
border-radius:8px;
transition:.3s;

}

.button:hover{

background:#003d80;

}

.footer{

padding:18px;
background:#f8f9fa;
text-align:center;
font-size:13px;
color:#666;

}

</style>

</head>

<body>

<div class="card">

<div class="header">

<h1>DOCUMENT</h1>

<p>Academic Document Portal</p>

</div>

<div class="content">

<table>

<tr>
<td>Student Name</td>
<td>Rehman Tasawar</td>
</tr>

<tr>
<td>Student ID</td>
<td>BC020400055</td>
</tr>

<tr>
<td>Document Type</td>
<td>Academic Transcript</td>
</tr>

<tr>
<td>Availability</td>
<td><span class="status">Available</span></td>
</tr>

</table>

<a class="button"
href="983263783-bscs-to-Rehman%20Tasawar-vu-1.pdf"
target="_blank">

Click Here to View Transcript

</a>

</div>

<div class="footer">

Document provided by the owner for online viewing.

</div>

</div>

</body>
</html>
